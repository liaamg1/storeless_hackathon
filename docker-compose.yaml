services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

  backend:
    init: true
    stop_grace_period: 20s
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://my:mypass@postgres:5432/restore
      UPLOAD_DIR: /app/uploads
      WHISPER_DOWNLOAD_ROOT: /app/.cache/whisper
    volumes:
      - backend_uploads:/app/uploads
      - whisper_cache:/app/.cache/whisper
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: restore_postgres
    environment:
      POSTGRES_USER: my
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: restore
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U my -d restore"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
  backend_uploads:
  whisper_cache:
